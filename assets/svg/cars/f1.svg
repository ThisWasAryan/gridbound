<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -40 40 80" width="60" height="120">
    <g transform="rotate(90)">
        <!-- Tyres (Black/dark grey, ribbed) -->
        <rect x="-17" y="-28" width="8" height="18" rx="2" fill="#1f1f1f"/>
        <line x1="-15" y1="-28" x2="-15" y2="-10" stroke="#333" stroke-width="0.5"/>
        <line x1="-13" y1="-28" x2="-13" y2="-10" stroke="#333" stroke-width="0.5"/>
        <line x1="-11" y1="-28" x2="-11" y2="-10" stroke="#333" stroke-width="0.5"/>
        
        <rect x="9" y="-28" width="8" height="18" rx="2" fill="#1f1f1f"/>
        <line x1="11" y1="-28" x2="11" y2="-10" stroke="#333" stroke-width="0.5"/>
        <line x1="13" y1="-28" x2="13" y2="-10" stroke="#333" stroke-width="0.5"/>
        <line x1="15" y1="-28" x2="15" y2="-10" stroke="#333" stroke-width="0.5"/>

        <rect x="-19" y="16" width="9" height="20" rx="2" fill="#1f1f1f"/>
        <line x1="-17" y1="16" x2="-17" y2="36" stroke="#333" stroke-width="0.5"/>
        <line x1="-14.5" y1="16" x2="-14.5" y2="36" stroke="#333" stroke-width="0.5"/>
        <line x1="-12" y1="16" x2="-12" y2="36" stroke="#333" stroke-width="0.5"/>
        
        <rect x="10" y="16" width="9" height="20" rx="2" fill="#1f1f1f"/>
        <line x1="12" y1="16" x2="12" y2="36" stroke="#333" stroke-width="0.5"/>
        <line x1="14.5" y1="16" x2="14.5" y2="36" stroke="#333" stroke-width="0.5"/>
        <line x1="17" y1="16" x2="17" y2="36" stroke="#333" stroke-width="0.5"/>
        
        <!-- Suspension lines (dark) -->
        <line x1="-3" y1="-18" x2="-13" y2="-16" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="-3" y1="-18" x2="-13" y2="-22" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="3" y1="-18" x2="13" y2="-16" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="3" y1="-18" x2="13" y2="-22" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="-3" y1="22" x2="-14" y2="20" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="-3" y1="22" x2="-14" y2="28" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="3" y1="22" x2="14" y2="20" stroke="#1f1f1f" stroke-width="1.5"/>
        <line x1="3" y1="22" x2="14" y2="28" stroke="#1f1f1f" stroke-width="1.5"/>

        <!-- Front Wing Base (Red and White) -->
        <path d="M -18 -36 L 18 -36 L 18 -31 L -18 -31 Z" fill="#e60000"/>
        <path d="M -16 -34 L -4 -34 L -5 -31 L -16 -31 Z" fill="#ffffff"/>
        <path d="M 16 -34 L 4 -34 L 5 -31 L 16 -31 Z" fill="#ffffff"/>
        <!-- Front Wing Endplates -->
        <path d="M -18 -37 L -16 -37 L -16 -28 L -18 -28 Z" fill="#1f1f1f"/>
        <path d="M 18 -37 L 16 -37 L 16 -28 L 18 -28 Z" fill="#1f1f1f"/>
        
        <!-- Floor / Black Base -->
        <path d="M -13 -6 L 13 -6 L 15 20 L -15 20 Z" fill="#1f1f1f"/>
        
        <!-- Main Red Body -->
        <path d="M -2.5 -35 L 2.5 -35 L 4 -15 L 7 5 L 4 25 L -4 25 L -7 5 L -4 -15 Z" fill="#e60000"/>
        
        <!-- Sidepods (Red) -->
        <path d="M -4 -8 L -12 -7 L -13 5 L -10 20 L -4 20 Z" fill="#e60000"/>
        <path d="M 4 -8 L 12 -7 L 13 5 L 10 20 L 4 20 Z" fill="#e60000"/>
        
        <!-- Yellow Nose Cone Decal (Shell Logo) -->
        <circle cx="0" cy="-30" r="1.5" fill="#ffd700"/>
        
        <!-- Cockpit Area -->
        <path d="M -3 -1 C -3 8, 3 8, 3 -1 Z" fill="#14161b"/>
        
        <!-- Halo (White/Light Grey) -->
        <path d="M -3.5 -1 C -3.5 -5, 3.5 -5, 3.5 -1" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
        <line x1="0" y1="-5" x2="0" y2="-1" stroke="#d1d5db" stroke-width="1.5"/>
        
        <!-- Airbox -->
        <path d="M -1.5 5 L 1.5 5 L 1.5 8 L -1.5 8 Z" fill="#14161b"/>
        
        <!-- Engine Cover Fin (White stripe) -->
        <line x1="0" y1="10" x2="0" y2="25" stroke="#ffffff" stroke-width="1.5"/>
        
        <!-- Rear Wing (Red and White) -->
        <path d="M -16 26 L 16 26 L 16 35 L -16 35 Z" fill="#ffffff"/>
        <path d="M -16 33 L 16 33 L 16 35 L -16 35 Z" fill="#e60000"/>
        <!-- Rear Wing Endplates -->
        <path d="M -17 25 L -15 25 L -15 36 L -17 36 Z" fill="#e60000"/>
        <path d="M 17 25 L 15 25 L 15 36 L 17 36 Z" fill="#e60000"/>
    </g>
</svg>
