<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -15 50 30" width="38" height="19">
    <g transform="rotate(90)">
        <!-- Tyres with grooves -->
        <rect x="-11" y="-16" width="5" height="9" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="-11" y1="-14" x2="-6" y2="-14" stroke="#242933" stroke-width="0.5"/>
        <line x1="-11" y1="-11.5" x2="-6" y2="-11.5" stroke="#242933" stroke-width="0.5"/>
        <line x1="-11" y1="-9" x2="-6" y2="-9" stroke="#242933" stroke-width="0.5"/>

        <rect x="6" y="-16" width="5" height="9" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="6" y1="-14" x2="11" y2="-14" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="-11.5" x2="11" y2="-11.5" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="-9" x2="11" y2="-9" stroke="#242933" stroke-width="0.5"/>

        <rect x="-12" y="10" width="6" height="11" rx="1.5" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="-12" y1="12" x2="-6" y2="12" stroke="#242933" stroke-width="0.5"/>
        <line x1="-12" y1="15.5" x2="-6" y2="15.5" stroke="#242933" stroke-width="0.5"/>
        <line x1="-12" y1="19" x2="-6" y2="19" stroke="#242933" stroke-width="0.5"/>

        <rect x="6" y="10" width="6" height="11" rx="1.5" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="6" y1="12" x2="12" y2="12" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="15.5" x2="12" y2="15.5" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="19" x2="12" y2="19" stroke="#242933" stroke-width="0.5"/>
        
        <!-- Front Wing -->
        <path d="M -11 -21 L 11 -21 L 9 -17 L -9 -17 Z" fill="#242933" stroke="#ffb020" stroke-width="1.5"/>
        <path d="M -8 -19 L 8 -19" stroke="#ffb020" stroke-width="0.5"/>
        
        <!-- Main Body -->
        <path d="M -2 -17 L 2 -17 L 6 5 L 5 15 L -5 15 L -6 5 Z" fill="#1d2129" stroke="#e7e9ee" stroke-width="1.5"/>
        
        <!-- Sidepods -->
        <path d="M -6 5 L -9 6 L -9 12 L -5 13 Z" fill="#242933" stroke="#8a8f9a" stroke-width="1"/>
        <path d="M 6 5 L 9 6 L 9 12 L 5 13 Z" fill="#242933" stroke="#8a8f9a" stroke-width="1"/>
        
        <!-- Rear Wing -->
        <path d="M -10 16 L 10 16 L 10 19 L -10 19 Z" fill="#242933" stroke="#ffb020" stroke-width="1.5"/>
        
        <!-- Cockpit -->
        <path d="M -2.5 0 C -2.5 5, 2.5 5, 2.5 0 Z" fill="#14161b" stroke="#e7e9ee" stroke-width="1"/>
        <circle cx="0" cy="2" r="1.5" fill="#e10600" />
        
        <!-- Halo -->
        <path d="M -3 0 C -3 -3.5, 3 -3.5, 3 0" fill="none" stroke="#e7e9ee" stroke-width="1"/>
        <line x1="0" y1="-3.5" x2="0" y2="0" stroke="#e7e9ee" stroke-width="1"/>
    </g>
</svg>
