<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -15 30 30" width="30" height="30">
    <g transform="rotate(90)">
        <!-- Tyres (with grooves) -->
        <rect x="-8" y="-12" width="4" height="6" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="-8" y1="-10" x2="-4" y2="-10" stroke="#242933" stroke-width="0.5"/>
        <line x1="-8" y1="-8" x2="-4" y2="-8" stroke="#242933" stroke-width="0.5"/>
        
        <rect x="4" y="-12" width="4" height="6" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="4" y1="-10" x2="8" y2="-10" stroke="#242933" stroke-width="0.5"/>
        <line x1="4" y1="-8" x2="8" y2="-8" stroke="#242933" stroke-width="0.5"/>

        <rect x="-9" y="6" width="5" height="7" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="-9" y1="8" x2="-4" y2="8" stroke="#242933" stroke-width="0.5"/>
        <line x1="-9" y1="11" x2="-4" y2="11" stroke="#242933" stroke-width="0.5"/>
        
        <rect x="4" y="6" width="5" height="7" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="4" y1="8" x2="9" y2="8" stroke="#242933" stroke-width="0.5"/>
        <line x1="4" y1="11" x2="9" y2="11" stroke="#242933" stroke-width="0.5"/>
        
        <!-- Chassis frame -->
        <path d="M -4 -8 L -4 8 L 4 8 L 4 -8 Z" fill="none" stroke="#e7e9ee" stroke-width="1.5"/>
        <line x1="-4" y1="0" x2="4" y2="0" stroke="#e7e9ee" stroke-width="1.5"/>

        <!-- Front bumper -->
        <path d="M -6 -10 L 6 -10" stroke="#b26bff" stroke-width="2" stroke-linecap="round"/>
        
        <!-- Rear bumper -->
        <path d="M -7 11 L 7 11" stroke="#8a8f9a" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Steering / Seat -->
        <circle cx="0" cy="0" r="2" fill="none" stroke="#e7e9ee" stroke-width="1"/>
        <path d="M -3 3 C -3 6, 3 6, 3 3 Z" fill="#242933" stroke="#8a8f9a" stroke-width="1"/>
    </g>
</svg>
