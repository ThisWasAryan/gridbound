<?xml version="1.0" encoding="UTF-8"?>
<!--
  Track: Buddh International Circuit
  Direction: clockwise
  Turns: 16
  Length: 5.125 km
  
  SECTOR ENCODING:
  ================
  Sectors are encoded in multiple ways for flexibility:
  
  1. data-sectors attribute on #raceline: "0,0.3,0.7,1.0"
     Format: "s1_start,s2_start,s3_start,s3_end" as fractions of total path length.
     Use with path.getTotalLength() * fraction to get the point at each boundary.
     Example JS:
       const raceline = document.getElementById('raceline');
       const totalLen = raceline.getTotalLength();
       const sectors = raceline.dataset.sectors.split(',').map(Number);
       const sector2Start = raceline.getPointAtLength(totalLen * sectors[1]);
  
  2. Individual <path> elements with data-sector="N" attribute (N = 1, 2, or 3).
     These are visual overlays colored per sector.
     To change a sector color:
       document.querySelector('[data-sector="1"]').style.stroke = '#YOUR_COLOR';
  
  3. Sector boundary <line> elements with data-sector-boundary="N-M".
     These mark where sectors transition visually.
  
  CHANGING COLORS:
  ================
  - Sector 1 (Red):   stroke on path[data-sector="1"]  → default #FF3333
  - Sector 2 (Green): stroke on path[data-sector="2"]  → default #33FF33  
  - Sector 3 (Blue):  stroke on path[data-sector="3"]  → default #3333FF
  - Boundary markers: stroke on line.sector-marker      → default #FFFFFF
  - Track surface:    fill on #track-surface             → default #2A2F35
  - Raceline road:    stroke on #raceline                → default #333945
  - Background:       fill on background <rect>          → default #1A1F24
  - Start/Finish:     stroke on #start-finish            → default #E7E9EE
  
  SECTOR DESCRIPTIONS:
  ====================
  Sector 1: Turn 1 → Back Straight → Turn 4
  Sector 2: Esses → Parabolic Carousel
  Sector 3: Turn 13 → Final Complex → Finish
-->
