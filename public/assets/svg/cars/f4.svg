<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -15 40 30" width="30" height="15">
    <g transform="rotate(90)">
        <!-- Tyres with grooves -->
        <rect x="-10" y="-14" width="4" height="8" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="-10" y1="-12" x2="-6" y2="-12" stroke="#242933" stroke-width="0.5"/>
        <line x1="-10" y1="-10" x2="-6" y2="-10" stroke="#242933" stroke-width="0.5"/>
        <line x1="-10" y1="-8" x2="-6" y2="-8" stroke="#242933" stroke-width="0.5"/>

        <rect x="6" y="-14" width="4" height="8" rx="1" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="6" y1="-12" x2="10" y2="-12" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="-10" x2="10" y2="-10" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="-8" x2="10" y2="-8" stroke="#242933" stroke-width="0.5"/>

        <rect x="-11" y="8" width="5" height="9" rx="1.5" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="-11" y1="10" x2="-6" y2="10" stroke="#242933" stroke-width="0.5"/>
        <line x1="-11" y1="12" x2="-6" y2="12" stroke="#242933" stroke-width="0.5"/>
        <line x1="-11" y1="14" x2="-6" y2="14" stroke="#242933" stroke-width="0.5"/>

        <rect x="6" y="8" width="5" height="9" rx="1.5" fill="#14161b" stroke="#8a8f9a" stroke-width="0.5"/>
        <line x1="6" y1="10" x2="11" y2="10" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="12" x2="11" y2="12" stroke="#242933" stroke-width="0.5"/>
        <line x1="6" y1="14" x2="11" y2="14" stroke="#242933" stroke-width="0.5"/>
        
        <!-- Front Wing -->
        <path d="M -9 -17 L 9 -17 L 7 -14 L -7 -14 Z" fill="#242933" stroke="#ffb020" stroke-width="1.5"/>
        
        <!-- Main Body -->
        <path d="M -3 -14 L 3 -14 L 5 2 L 4 12 L -4 12 L -5 2 Z" fill="#1d2129" stroke="#e7e9ee" stroke-width="1.5"/>
        
        <!-- Intake/Engine Cover detail -->
        <path d="M -2 4 L 2 4 L 3 10 L -3 10 Z" fill="#242933" stroke="#8a8f9a" stroke-width="1"/>
        
        <!-- Rear Wing -->
        <path d="M -8 13 L 8 13 L 8 16 L -8 16 Z" fill="#242933" stroke="#ffb020" stroke-width="1.5"/>
        
        <!-- Cockpit -->
        <path d="M -2 -2 C -2 3, 2 3, 2 -2 Z" fill="#14161b" stroke="#e7e9ee" stroke-width="1"/>
        
        <!-- Driver Helmet -->
        <circle cx="0" cy="0" r="1.5" fill="#e10600" />
    </g>
</svg>
